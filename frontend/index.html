<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Poppins',system-ui,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;background:#1b6f72}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* status pill + backend url */
.top{position:fixed;top:14px;left:14px;z-index:5;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 28px)}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;padding:6px 12px;border-radius:20px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);cursor:pointer;width:fit-content;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.on{background:#5dffc9;animation:pulse 2s infinite}.dot.off{background:#ff6b5e}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(93,255,201,.25)}50%{box-shadow:0 0 0 6px rgba(93,255,201,.05)}}
.urlbar{display:none;gap:6px}
.urlbar.open{display:flex}
.urlbar input{width:230px;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;font:12px 'Poppins',sans-serif;outline:none}
.urlbar button{padding:8px 12px;border-radius:8px;border:none;background:#fff;color:#1b4a4c;font:500 12px 'Poppins',sans-serif;cursor:pointer}

/* glass card */
.card{position:relative;z-index:2;width:min(380px,calc(100vw - 32px));padding:38px 34px 30px;border-radius:30px;border:2px solid rgba(255,255,255,.75);background:rgba(255,255,255,.10);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);box-shadow:0 20px 60px rgba(0,0,0,.25)}
h1{margin:0 0 30px;text-align:center;font-weight:500;font-size:24px}
.view{display:none}.view.active{display:block}
.field{position:relative;margin-bottom:6px;border-bottom:2px solid rgba(255,255,255,.9);display:flex;align-items:center;gap:10px;padding:10px 2px 8px}
.field.bad{border-color:#ff9a8f}.field.good{border-color:#8dffd9}
.field svg{width:18px;height:18px;flex:none;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;font:500 15px 'Poppins',sans-serif}
.field input::placeholder{color:#fff;opacity:1}
.eye{cursor:pointer;background:none;border:none;padding:0;display:flex}
.hint{font-size:11px;min-height:16px;margin:0 0 16px 28px;color:rgba(255,255,255,.75)}
.hint.bad{color:#ffb3aa}.hint.good{color:#a8ffe5}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:6px 0 20px}
.row label{display:flex;align-items:center;gap:8px;cursor:pointer}
.row input[type=checkbox]{appearance:none;width:12px;height:12px;border:1.5px solid #fff;background:transparent;margin:0;cursor:pointer;position:relative}
.row input[type=checkbox]:checked{background:#fff}
.row a{color:#fff;text-decoration:none;cursor:pointer}.row a:hover{text-decoration:underline}
.btn{width:100%;padding:13px;border:none;border-radius:8px;background:rgba(255,255,255,.88);color:#223;font:500 15px 'Poppins',sans-serif;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){background:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.alt{text-align:center;font-size:13.5px;margin-top:24px}
.alt a{cursor:pointer;font-weight:500}.alt a:hover{text-decoration:underline}
.msg{display:none;font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:16px;text-align:center}
.msg.error{display:block;background:rgba(120,20,15,.45);border:1px solid rgba(255,160,150,.6)}
.msg.success{display:block;background:rgba(10,90,70,.45);border:1px solid rgba(140,255,215,.6)}
.welcome{text-align:center}
.welcome .av{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;background:rgba(255,255,255,.15)}
.welcome p{margin:4px 0 22px;font-size:13px;opacity:.9}

/* live bits */
.live{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;font-size:12px;padding:6px 14px;border-radius:20px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);white-space:nowrap}
.toasts{position:fixed;right:14px;bottom:14px;z-index:6;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{font-size:12.5px;padding:9px 14px;border-radius:10px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);animation:tin .3s,tout .4s 3.6s forwards}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@keyframes tout{to{opacity:0;transform:translateY(8px)}}
@media(max-width:520px){.live{bottom:60px}}
</style>
</head>
<body>

<!-- Scenery -->
<svg id="bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#1c8a8b"/><stop offset=".45" stop-color="#3f8f8d"/>
      <stop offset=".7" stop-color="#e2796a"/><stop offset="1" stop-color="#f19a7c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".55" r=".5">
      <stop offset="0" stop-color="#ffd1b0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd1b0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect x="0" y="0" width="1440" height="560"/></clipPath>
    <clipPath id="below"><rect x="0" y="560" width="1440" height="340"/></clipPath>
    <filter id="ripple"><feTurbulence type="fractalNoise" baseFrequency="0.002 0.06" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
    <g id="tree">
      <path d="M-7 0 Q-4 -80 -10 -150 L6 -150 Q2 -80 9 0Z" fill="#3a1d2a"/>
      <ellipse cx="0" cy="-185" rx="95" ry="62" fill="#c93b44"/>
      <ellipse cx="-38" cy="-160" rx="62" ry="40" fill="#e05449"/>
      <ellipse cx="44" cy="-205" rx="58" ry="38" fill="#ee6a54"/>
      <ellipse cx="-10" cy="-225" rx="46" ry="30" fill="#f28460"/>
    </g>
    <g id="pine">
      <polygon points="0,-300 36,-200 18,-200 52,-120 26,-120 64,-40 -64,-40 -26,-120 -52,-120 -18,-200 -36,-200" fill="#0f4a4d"/>
      <rect x="-5" y="-40" width="10" height="40" fill="#0b3235"/>
    </g>
    <g id="scene">
      <rect width="1440" height="560" fill="url(#sky)"/>
      <rect width="1440" height="560" fill="url(#glow)"/>
      <path d="M-20 560 L120 380 L230 450 L360 330 L520 470 L640 560Z" fill="#146366"/>
      <path d="M760 560 L930 400 L1010 440 L1120 300 L1240 420 L1330 360 L1460 480 L1460 560Z" fill="#b8584f"/>
      <path d="M600 560 L760 470 L900 560Z" fill="#c76a5a" opacity=".8"/>
      <path d="M-20 560 L-20 470 Q200 430 420 500 Q560 530 700 560Z" fill="#0d4e50"/>
      <path d="M900 560 Q1120 470 1460 500 L1460 560Z" fill="#9a3f47"/>
      <use href="#pine" transform="translate(40 560) scale(1.15)"/>
      <use href="#pine" transform="translate(150 560) scale(.8)"/>
      <use href="#tree" transform="translate(255 560) scale(1.25)"/>
      <use href="#tree" transform="translate(400 560) scale(.9)"/>
      <use href="#tree" transform="translate(1210 560) scale(1.1)"/>
      <use href="#tree" transform="translate(1340 560) scale(.8)"/>
      <path d="M0 80 Q300 60 520 90" stroke="#ffd2bd" stroke-width="3" fill="none" opacity=".5"/>
      <path d="M900 130 Q1150 100 1440 150" stroke="#ffd2bd" stroke-width="4" fill="none" opacity=".45"/>
      <path d="M980 60 Q1200 40 1380 70" stroke="#ffd2bd" stroke-width="2" fill="none" opacity=".4"/>
    </g>
  </defs>
  <g clip-path="url(#above)"><use href="#scene"/></g>
  <g clip-path="url(#below)" filter="url(#ripple)" opacity=".85">
    <use href="#scene" transform="translate(0 1120) scale(1 -1)"/>
  </g>
  <rect y="560" width="1440" height="340" fill="#0f3d44" opacity=".22"/>
  <rect y="558" width="1440" height="4" fill="#ffffff" opacity=".18"/>
</svg>

<div class="top">
  <div class="pill" id="pill" title="Backend URL change karne ke liye click karo">
    <span class="dot" id="healthDot"></span><span id="healthText">not connected</span>
  </div>
  <div class="urlbar" id="urlbar">
    <input id="apiInput" type="text" placeholder="http://EC2-PUBLIC-IP:5000" spellcheck="false">
    <button id="connectBtn">Connect</button>
  </div>
</div>

<div class="card">
  <!-- LOGIN -->
  <div class="view active" id="loginView">
    <h1>Login</h1>
    <div class="msg" id="loginMsg"></div>
    <form id="loginForm" novalidate>
      <div class="field" id="lEmailF">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
      </div>
      <div class="hint" id="lEmailH"></div>
      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
        <button type="button" class="eye" data-for="loginPassword" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="hint"></div>
      <div class="row">
        <label><input type="checkbox" id="remember">Remember Me</label>
        <a id="forgot">Forgot Password?</a>
      </div>
      <button class="btn" id="loginBtn" type="submit" disabled>Login</button>
    </form>
    <div class="alt">Don’t have an account? <a data-go="signupView">Register</a></div>
  </div>

  <!-- REGISTER -->
  <div class="view" id="signupView">
    <h1>Register</h1>
    <div class="msg" id="signupMsg"></div>
    <form id="signupForm" novalidate>
      <div class="field" id="sUserF">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <input id="signupUsername" type="text" placeholder="Username" autocomplete="username">
      </div>
      <div class="hint" id="sUserH"></div>
      <div class="field" id="sEmailF">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <input id="signupEmail" type="email" placeholder="Email" autocomplete="email">
      </div>
      <div class="hint" id="sEmailH"></div>
      <div class="field" id="sPassF">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input id="signupPassword" type="password" placeholder="Password" autocomplete="new-password">
        <button type="button" class="eye" data-for="signupPassword" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="hint" id="sPassH"></div>
      <button class="btn" id="signupBtn" type="submit" style="margin-top:8px" disabled>Create account</button>
    </form>
    <div class="alt">Already have an account? <a data-go="loginView">Login</a></div>
  </div>

  <!-- SESSION -->
  <div class="view" id="sessionView">
    <div class="welcome">
      <div class="av" id="avatar">?</div>
      <h1 style="margin-bottom:6px" id="welcomeName">Welcome</h1>
      <p id="welcomeEmail"></p>
      <button class="btn" id="logoutBtn">Log out</button>
    </div>
  </div>
</div>

<div class="live" id="live">connect to backend</div>
<div class="toasts" id="toasts"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

/* ---------- views ---------- */
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id))}
document.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',()=>show(a.dataset.go)));
document.querySelectorAll('.eye').forEach(b=>b.addEventListener('click',()=>{
  const i=$(b.dataset.for);i.type=i.type==='password'?'text':'password';
}));
$('forgot').addEventListener('click',()=>toast('Forgot password abhi backend me enabled nahi hai'));

/* ---------- backend ---------- */
let API_BASE='',es=null,pollTimer=null,streamUp=false,users=[],online=null,up=false;
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(_){return ''}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(_){}};
const apiUrl=p=>API_BASE.replace(/\/$/,'')+p;
/* >>> BACKEND IP YAHAN PASTE KARO (public IPv4, port 5000) <<< */
const BACKEND_URL='http://PASTE-EC2-PUBLIC-IP:5000';

function defaultBase(){
  if(!BACKEND_URL.includes('PASTE'))return BACKEND_URL;
  const q=new URLSearchParams(location.search).get('api');if(q)return q;
  const s=lsGet('api_base');if(s)return s;
  return /^https?:$/.test(location.protocol)&&location.hostname?`http://${location.hostname}:5000`:'';
}
async function api(method,path,body){
  const t=performance.now();
  try{
    const x=await fetch(apiUrl(path),{method,headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});
    let d={};try{d=await x.json()}catch(_){}
    return{ok:x.ok,status:x.status,data:d,ms:Math.round(performance.now()-t)};
  }catch(e){
    return{ok:false,status:0,data:{error:'Backend unreachable. URL, port 5000 aur CORS check karo.'},ms:0};
  }
}

/* ---------- heartbeat ---------- */
async function heartbeat(){
  if(!API_BASE)return;
  const r=await api('GET','/api/health');
  up=r.status>0;
  $('healthDot').className='dot '+(up?'on':'off');
  $('healthText').textContent=up?`online · ${r.ms}ms`:'unreachable';
  refreshButtons();
}
setInterval(heartbeat,3000);

/* ---------- users + live ---------- */
function liveText(mode){
  const n=users.length,o=online?` · ${online.size} online`:'';
  $('live').textContent=`● ${n} users${o} · ${mode==='sse'?'live':'refreshing 4s'}`;
}
async function loadUsers(){
  const r=await api('GET','/api/users');
  if(!r.ok)return;
  const list=Array.isArray(r.data)?r.data:(r.data.users||[]);
  const prev=new Set(users.map(u=>u.id));
  if(prev.size){const added=list.filter(u=>!prev.has(u.id));added.forEach(u=>toast(`${u.username} just registered`))}
  users=list;
  if(list.some(u=>'online' in u))online=new Set(list.filter(u=>u.online).map(u=>u.id));
  liveText(streamUp?'sse':'poll');revalidateSignup();
}
function onEvent(e){
  const u=e.user||{};
  const t={signup:'just registered',login:'logged in',logout:'logged out'}[e.type];
  if(t)toast(`${u.username||'user'} ${t}`);
  if(Array.isArray(e.online))online=new Set(e.online);
  if(e.type==='signup'&&u.id!=null&&!users.some(x=>x.id===u.id))users.push(u);
  liveText('sse');revalidateSignup();
}
function stopLive(){if(es){es.close();es=null}clearInterval(pollTimer);pollTimer=null;streamUp=false}
function startPolling(){if(pollTimer)return;pollTimer=setInterval(loadUsers,4000);liveText('poll')}
function connectStream(){
  stopLive();if(!API_BASE)return;
  es=new EventSource(apiUrl('/api/stream'));
  const giveUp=setTimeout(()=>{if(!streamUp){es&&es.close();es=null;startPolling()}},4000);
  es.onopen=()=>{streamUp=true;clearTimeout(giveUp);clearInterval(pollTimer);pollTimer=null;liveText('sse')};
  es.onmessage=m=>{try{onEvent(JSON.parse(m.data))}catch(_){}};
  es.onerror=()=>{if(!streamUp){clearTimeout(giveUp);if(es){es.close();es=null}startPolling()}};
}
function toast(t){
  const d=document.createElement('div');d.className='toast';d.textContent=t;
  $('toasts').appendChild(d);setTimeout(()=>d.remove(),4000);
}

/* ---------- live validation ---------- */
function hint(h,f,text,state){
  const el=$(h);el.textContent=text;el.className='hint '+(state||'');
  if(f)$(f).className='field '+(state||'');
}
function refreshButtons(){
  $('loginBtn').disabled=!(up&&EMAIL_RE.test($('loginEmail').value.trim())&&$('loginPassword').value.length>0);
  const un=$('signupUsername').value.trim(),em=$('signupEmail').value.trim(),pw=$('signupPassword').value;
  const free=!users.some(u=>u.username.toLowerCase()===un.toLowerCase());
  $('signupBtn').disabled=!(up&&un.length>=3&&free&&EMAIL_RE.test(em)&&pw.length>=6);
}
$('loginEmail').addEventListener('input',()=>{
  const v=$('loginEmail').value.trim();
  if(!v)hint('lEmailH','lEmailF','');
  else if(EMAIL_RE.test(v))hint('lEmailH','lEmailF','valid email','good');
  else hint('lEmailH','lEmailF','email format sahi nahi','bad');
  refreshButtons();
});
$('loginPassword').addEventListener('input',refreshButtons);
function revalidateSignup(){
  const un=$('signupUsername').value.trim();
  if(!un)hint('sUserH','sUserF','');
  else if(un.length<3)hint('sUserH','sUserF','minimum 3 characters','bad');
  else if(users.some(u=>u.username.toLowerCase()===un.toLowerCase()))hint('sUserH','sUserF','username already taken','bad');
  else hint('sUserH','sUserF','username available','good');
  const em=$('signupEmail').value.trim();
  if(em){
    if(!EMAIL_RE.test(em))hint('sEmailH','sEmailF','email format sahi nahi','bad');
    else if(users.some(u=>u.email.toLowerCase()===em.toLowerCase()))hint('sEmailH','sEmailF','email already registered','bad');
    else hint('sEmailH','sEmailF','valid email','good');
  }
  refreshButtons();
}
$('signupUsername').addEventListener('input',revalidateSignup);
$('signupEmail').addEventListener('input',()=>{if(!$('signupEmail').value)hint('sEmailH','sEmailF','');revalidateSignup()});
$('signupPassword').addEventListener('input',()=>{
  const v=$('signupPassword').value;
  if(!v)hint('sPassH','sPassF','');
  else if(v.length<6)hint('sPassH','sPassF','minimum 6 characters','bad');
  else{
    const s=(v.length>=8)+/[A-Z]/.test(v)+/\d/.test(v)+/[^A-Za-z0-9]/.test(v);
    hint('sPassH','sPassF','strength: '+['weak','okay','good','strong','strong'][s],s>=2?'good':'');
  }
  refreshButtons();
});

/* ---------- forms ---------- */
const showMsg=(id,t,err)=>{const el=$(id);el.textContent=t;el.className='msg '+(err?'error':'success')};
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('loginMsg').className='msg';$('loginBtn').disabled=true;
  const email=$('loginEmail').value.trim();
  const r=await api('POST','/api/login',{email,password:$('loginPassword').value});
  if(r.ok){
    if($('remember').checked)lsSet('remember_email',email);else lsDel('remember_email');
    const u=r.data.user||{username:email.split('@')[0],email};
    $('avatar').textContent=(u.username||'?')[0].toUpperCase();
    $('welcomeName').textContent=`Welcome, ${u.username}`;
    $('welcomeEmail').textContent=u.email;
    $('loginPassword').value='';show('sessionView');
  }else showMsg('loginMsg',r.data.error||'Login failed.',true);
  refreshButtons();
});
$('signupForm').addEventListener('submit',async e=>{
  e.preventDefault();$('signupMsg').className='msg';$('signupBtn').disabled=true;
  const email=$('signupEmail').value.trim();
  const r=await api('POST','/api/signup',{username:$('signupUsername').value.trim(),email,password:$('signupPassword').value});
  if(r.ok){
    e.target.reset();['sUserH','sEmailH','sPassH'].forEach(h=>hint(h,null,''));
    ['sUserF','sEmailF','sPassF'].forEach(f=>$(f).className='field');
    $('loginEmail').value=email;show('loginView');
    showMsg('loginMsg',r.data.message||'Account created. Ab login karo.',false);
    if(!streamUp)loadUsers();
  }else showMsg('signupMsg',r.data.error||'Signup failed.',true);
  refreshButtons();
});
$('logoutBtn').addEventListener('click',()=>{show('loginView');$('loginMsg').className='msg'});

/* ---------- connect ---------- */
$('pill').addEventListener('click',()=>$('urlbar').classList.toggle('open'));
function connect(){
  const v=$('apiInput').value.trim().replace(/\/$/,'');if(!v)return;
  API_BASE=v;lsSet('api_base',v);$('urlbar').classList.remove('open');
  heartbeat();loadUsers().then(connectStream);
}
$('connectBtn').addEventListener('click',connect);
$('apiInput').addEventListener('keydown',e=>{if(e.key==='Enter')connect()});
$('apiInput').value=defaultBase();
const re=lsGet('remember_email');if(re){$('loginEmail').value=re;$('remember').checked=true;$('loginEmail').dispatchEvent(new Event('input'))}
if($('apiInput').value)connect();else $('urlbar').classList.add('open');
</script>
</body>
</html>
